# Every push and pull request: the kit type-checks, its tests pass, both examples pass check-game (the gate every game in
# kampuseapp/games must pass), and a new game from each template passes too, on Linux, Windows and macOS.
#
# A pull request's code is never trusted: this runs on `pull_request` (a fork gets no secrets and a read-only token), asks
# for read access only, keeps no credentials in the checkout, and installs without install scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '20.19' }
          - { os: ubuntu-latest, node: '22' }
          - { os: windows-latest, node: '22' }
          - { os: macos-latest, node: '22' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: The examples pass check-game
        shell: bash
        run: |
          npm run check-game -- examples/xox
          npm run check-game -- examples/ari
      - name: A new game from each template passes its checks
        shell: bash
        run: |
          npm run new -- ci-table
          npm run new -- ci-solo --solo
          npm run check
          npm test
          npm run check-game -- games/ci-table
          npm run check-game -- games/ci-solo
