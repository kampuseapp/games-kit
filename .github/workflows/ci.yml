# Every push and pull request: the kit type-checks, its tests pass, and a new game from each template passes too,
# on Linux, Windows and macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '20.19' }
          - { os: ubuntu-latest, node: '22' }
          - { os: windows-latest, node: '22' }
          - { os: macos-latest, node: '22' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: A new game from each template passes its checks
        shell: bash
        run: |
          npm run new -- ci-table
          npm run new -- ci-solo --solo
          npm run check
          npm test
