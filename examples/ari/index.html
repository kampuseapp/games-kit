<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arı Avı</title>
    <style>
      :root { --ink: #0e2148; --soft: #4a5a7d; --card: #fff; --honey: #ffc233; --sky: #bfe3f5; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { background: var(--sky); color: var(--ink); font: 15px/1.35 system-ui, -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
      .top { position: absolute; inset: 12px 12px auto; display: flex; justify-content: space-between; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
      .field { position: absolute; inset: 0; overflow: hidden; touch-action: manipulation; }
      .bee { position: absolute; width: 56px; height: 56px; margin: -28px; border: 0; background: none; font-size: 40px; cursor: pointer; animation: buzz 0.4s ease-in-out infinite alternate; }
      .bee.gold { font-size: 46px; filter: drop-shadow(0 0 6px gold); }
      @keyframes buzz { from { transform: translateY(-3px) rotate(-6deg); } to { transform: translateY(3px) rotate(6deg); } }
      .card { position: absolute; inset: auto 16px 50% 16px; transform: translateY(50%); padding: 18px; border: 2px solid var(--ink); border-radius: 18px; background: var(--card); box-shadow: 0 4px 0 var(--ink); text-align: center; }
      .card h1 { margin: 0 0 6px; font-size: 26px; }
      .card p { margin: 0 0 14px; color: var(--soft); font-weight: 600; }
      .card button { min-height: 44px; padding: 0 20px; border: 2px solid var(--ink); border-radius: 14px; background: var(--honey); box-shadow: 0 3px 0 var(--ink); font: inherit; font-weight: 800; color: inherit; }
    </style>
  </head>
  <body>
    <div class="field" id="field"></div>
    <div class="top"><span id="score">0</span><span id="time"></span></div>
    <div class="card" id="card"></div>
    <script type="module" src="./screen.ts"></script>
  </body>
</html>
